<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>치이카와 PPT 템플릿 · 이디</title>
<meta name="description" content="팀플·과제 발표용 치이카와 테마 PPT 9장 무료 나눔">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
@font-face{font-family:Paperlogy;src:url(img/Paperlogy-7Bold.ttf);font-weight:700}
:root{--o:#ff7a1a;--ol:#fff0e0;--ink:#191f28;--sub:#4e5968;--mute:#8b95a1;--line:#ece6da;--bg:#fff7e8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg) radial-gradient(#f3e6cc 1.4px,transparent 1.6px) 0 0/18px 18px;color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,sans-serif;word-break:keep-all;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:28px 16px 60px}
h1,h2{font-family:Paperlogy,"Pretendard Variable",sans-serif}
.brand{font-size:14px;font-weight:700;color:var(--o)}
.hero{margin-top:18px;background:#fff;border:2.5px solid var(--ink);border-radius:24px;padding:26px 22px 150px;position:relative;overflow:hidden}
.tag{display:inline-block;background:var(--o);color:#fff;font-size:12px;font-weight:700;padding:5px 12px;border-radius:99px}
.hero h1{font-size:31px;line-height:1.3;margin:14px 0 10px;letter-spacing:-.5px}
.hero h1 em{font-style:normal;color:var(--o);box-shadow:inset 0 -10px 0 #ffe2c4}
.hero p{font-size:16px;line-height:1.55;color:var(--sub);margin:0;font-weight:600;max-width:62%}
.hero .ch{position:absolute;right:26px;bottom:-40px;width:160px}
.dl{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:18px;background:var(--o);color:#fff;text-decoration:none;font-size:18px;font-weight:800;border:2.5px solid var(--ink);border-radius:18px;padding:16px;box-shadow:0 4px 0 var(--ink)}
.dl small{font-weight:600;opacity:.9;font-size:13px}
h2{font-size:20px;margin:34px 0 12px;letter-spacing:-.3px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid img{width:100%;display:block;border-radius:12px;border:1.5px solid var(--line);background:#fff}
.grid img:first-child{grid-column:1/-1}
.note{background:#fff;border:2.5px solid var(--ink);border-radius:20px;padding:18px;margin-top:30px}
.note b{display:block;font-size:16px;margin-bottom:8px}
.note li{font-size:15px;line-height:1.7;color:var(--sub);font-weight:600}
.note ul{margin:0;padding-left:18px}
.foot{margin-top:28px;text-align:center;font-size:13px;color:var(--mute);font-weight:600;line-height:1.6}
.foot a{color:var(--o);text-decoration:none;font-weight:800}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">이디 · PPT 꿀팁툰</div>
  <section class="hero">
    <span class="tag">무료 나눔</span>
    <h1>치이카와 <em>PPT 템플릿</em></h1>
    <p>팀플·과제 발표 분위기 살릴 때 쓰기 좋은 9장 구성이에요. 글씨만 바꿔서 바로 쓰세요!</p>
    <img class="ch" src="img/edi_char2.png" alt="이디">
  </section>

  <a class="dl" href="chiikawa_ppt_template.pptx" download>PPT 파일 받기 <small>(pptx · 9장)</small></a>

  <h2>이렇게 생겼어요</h2>
  <div class="grid">
    <img src="img/s1.jpg" alt="표지" loading="lazy">
    <img src="img/s2.jpg" alt="섬 모험" loading="lazy">
    <img src="img/s3.jpg" alt="할 일" loading="lazy">
    <img src="img/s4.jpg" alt="친구 소개" loading="lazy">
    <img src="img/s5.jpg" alt="응원" loading="lazy">
    <img src="img/s6.jpg" alt="명대사" loading="lazy">
    <img src="img/s7.jpg" alt="할 일 목록" loading="lazy">
    <img src="img/s8.jpg" alt="STEP" loading="lazy">
    <img src="img/s9.jpg" alt="마무리" loading="lazy">
  </div>

  <div class="note">
    <b>꼭 읽어 주세요</b>
    <ul>
      <li>개인 과제·발표 용도로만 써 주세요.</li>
      <li>캐릭터 이미지가 들어간 팬메이드 템플릿이라 판매·재배포는 안 돼요.</li>
      <li>폰트가 없으면 글씨 모양이 달라 보일 수 있어요. 원하는 폰트로 바꿔 쓰세요.</li>
    </ul>
  </div>

  <div class="foot">더 많은 PPT 꿀팁과 무료 템플릿은<br><a href="https://www.instagram.com/ppt.edi/">@ppt.edi</a> 에서 받아 가세요</div>
</div>
</body>
</html>
